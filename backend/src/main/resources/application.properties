# ================================================================
# ROMELT TECHCARE ? APPLICATION CONFIGURATION
# ================================================================
#
# Purpose:
# Configures the Spring Boot backend, PostgreSQL connection,
# Hibernate/JPA, JWT authentication, frontend CORS, email delivery,
# SMS delivery, JSON handling, and application logging.
#
# Current environment:
# Local development
#
# Design:
# - Stateless JWT authentication
# - PostgreSQL persistence
# - React frontend integration
# - Spring Mail + MailerSend SMTP for transactional email
# - Twilio for transactional SMS
# - Database-backed administrator in-app notifications
# ================================================================


# ================================================================
# APPLICATION
# ================================================================

spring.application.name=backend

app.public-site-url=${PUBLIC_SITE_URL:http://localhost:5173}


# ================================================================
# SERVER
# ================================================================

server.port=${SERVER_PORT:8080}

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false


# ================================================================
# POSTGRESQL CONNECTION
# ================================================================

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/romelt_techcare}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:romelta2}
spring.datasource.driver-class-name=org.postgresql.Driver


# ================================================================
# HIKARI CONNECTION POOL
# ================================================================

spring.datasource.hikari.pool-name=RomeltTechCarePool

spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# ================================================================
# JPA / HIBERNATE
# ================================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.open-in-view=false

spring.jpa.show-sql=false

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.default_batch_fetch_size=25


# ================================================================
# JACKSON / JSON
# ================================================================

spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC


# ================================================================
# REQUEST VALIDATION
# ================================================================

spring.mvc.problemdetails.enabled=false


# ================================================================
# PUBLIC FRONTEND INTEGRATION / CORS
# ================================================================

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}


# ================================================================
# JWT CONFIGURATION
# ================================================================

romelt.security.jwt.secret=${ROMELT_JWT_SECRET:RomeltTechCareDevelopmentSecretKey2026JWT123456789}

romelt.security.jwt.issuer=${ROMELT_JWT_ISSUER:romelt-techcare-backend}

romelt.security.jwt.audience=${ROMELT_JWT_AUDIENCE:romelt-techcare-admin}

romelt.security.jwt.access-token-lifetime=${ROMELT_JWT_ACCESS_TOKEN_LIFETIME:30m}


# ================================================================
# INITIAL ADMINISTRATOR
# ================================================================

romelt.admin.seed.enabled=${ROMELT_ADMIN_SEED_ENABLED:false}

app.admin.email=${ROMELT_ADMIN_EMAIL:}

app.admin.password=${ROMELT_ADMIN_PASSWORD:}


# ================================================================
# SIMPLE NOTIFICATION CONFIGURATION
# ================================================================
#
# EMAIL:
# Spring Boot JavaMailSender through MailerSend SMTP.
#
# SMS:
# Twilio Java SDK.
#
# IN_APP:
# PostgreSQL notifications table + WebSocket.
# ================================================================


# ================================================================
# EMAIL NOTIFICATION SETTINGS
# ================================================================

notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:false}

notification.email.from-address=${NOTIFICATION_EMAIL_FROM_ADDRESS:notifications@romelt.com}

notification.email.from-name=${NOTIFICATION_EMAIL_FROM_NAME:Romelt TechCare}

notification.email.reply-to-address=${NOTIFICATION_EMAIL_REPLY_TO:rdtargbeh@gmail.com}


# ================================================================
# MAILERSEND SMTP CONNECTION
# ================================================================
#
# Production SMTP relay:
# smtp.mailersend.net
#
# MailerSend supports TLS on port 587.
#
# Credentials must be supplied through environment variables.
# Do not store the SMTP password in this file.
# ================================================================

spring.mail.host=${SMTP_HOST:smtp.mailersend.net}

spring.mail.port=${SMTP_PORT:587}

spring.mail.username=${SMTP_USERNAME:}

spring.mail.password=${SMTP_PASSWORD:}

spring.mail.protocol=smtp

spring.mail.default-encoding=UTF-8

spring.mail.test-connection=false


# ================================================================
# SMTP SECURITY
# ================================================================

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.starttls.required=true


# ================================================================
# SMTP TIMEOUTS
# ================================================================

spring.mail.properties.mail.smtp.connectiontimeout=10000

spring.mail.properties.mail.smtp.timeout=15000

spring.mail.properties.mail.smtp.writetimeout=15000


# ================================================================
# SMS NOTIFICATION SETTINGS
# ================================================================

notification.sms.enabled=${NOTIFICATION_SMS_ENABLED:false}

notification.sms.provider=twilio

notification.sms.account-sid=${TWILIO_ACCOUNT_SID:}

notification.sms.api-key-sid=${TWILIO_API_KEY_SID:}

notification.sms.api-key-secret=${TWILIO_API_KEY_SECRET:}

notification.sms.messaging-service-sid=${TWILIO_MESSAGING_SERVICE_SID:}

notification.sms.status-callback-url=${TWILIO_STATUS_CALLBACK_URL:}

notification.sms.validity-period-seconds=${TWILIO_MESSAGE_VALIDITY_SECONDS:3600}


# ================================================================
# LOGGING
# ================================================================

logging.level.root=INFO

logging.level.romelt_techcare.backend=INFO

logging.level.org.springframework.web=INFO

logging.level.org.springframework.mail=INFO

logging.level.org.hibernate.SQL=INFO

logging.level.org.hibernate.orm.jdbc.bind=WARN