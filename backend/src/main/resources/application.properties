# ================================================================
# ROMELT TECHCARE ? APPLICATION CONFIGURATION
# ================================================================
#
# Purpose:
# Configures the Spring Boot backend, PostgreSQL connection,
# Hibernate/JPA, JWT authentication, frontend CORS, JSON handling,
# and logging.
#
# Current environment:
# Local development
#
# Design:
# - Stateless authentication
# - PostgreSQL persistence
# - Spring Security native JWT
# - React frontend integration
# ================================================================


# ================================================================
# APPLICATION
# ================================================================

spring.application.name=backend


# ================================================================
# SERVER
# ================================================================

server.port=8080

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false


# ================================================================
# POSTGRESQL CONNECTION
# ================================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/romelt_techcare
spring.datasource.username=postgres
spring.datasource.password=romelta2
spring.datasource.driver-class-name=org.postgresql.Driver


# ================================================================
# HIKARI CONNECTION POOL
# ================================================================

spring.datasource.hikari.pool-name=RomeltTechCarePool

spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000


# ================================================================
# JPA / HIBERNATE
# ================================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.open-in-view=false

spring.jpa.show-sql=false

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.default_batch_fetch_size=25


# ================================================================
# JACKSON / JSON
# ================================================================

spring.jackson.default-property-inclusion=non_null


# ================================================================
# REQUEST VALIDATION
# ================================================================

spring.mvc.problemdetails.enabled=false


# ================================================================
# PUBLIC FRONTEND INTEGRATION / CORS
# ================================================================

app.cors.allowed-origin=http://localhost:5173


# ================================================================
# JWT CONFIGURATION
# ================================================================
#
# These values are consumed by:
# JwtConfigurationProperties
#
# Environment variables:
#
# ROMELT_JWT_SECRET
# ROMELT_JWT_ISSUER
# ROMELT_JWT_AUDIENCE
#
# The secret must be at least 32 UTF-8 bytes.
# ================================================================

romelt.security.jwt.secret=RomeltTechCareDevelopmentSecretKey2026JWT123456789

romelt.admin.seed.enabled=${ROMELT_ADMIN_SEED_ENABLED:false}

romelt.security.jwt.issuer=${ROMELT_JWT_ISSUER:romelt-techcare-backend}

romelt.security.jwt.audience=${ROMELT_JWT_AUDIENCE:romelt-techcare-admin}

romelt.security.jwt.access-token-lifetime=30m


# ================================================================
# INITIAL ADMINISTRATOR
# ================================================================

app.admin.email=${ROMELT_ADMIN_EMAIL}

app.admin.password=${ROMELT_ADMIN_PASSWORD}


# ================================================================
# LOGGING
# ================================================================

logging.level.root=INFO

logging.level.romelt_techcare.backend=INFO

logging.level.org.springframework.web=INFO

logging.level.org.hibernate.SQL=INFO

logging.level.org.hibernate.orm.jdbc.bind=WARN

